name: Build & Push Bookskyy Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/booksyyy:frontend-1 ./bookskyy
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/booksyyy:frontend-1

      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/booksyyy:backend-1 ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/booksyyy:backend-1
